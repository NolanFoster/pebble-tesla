name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Builds the watchapp .pbw with the Rebble fork of the Pebble SDK.
# This compiles for all targetPlatforms (basalt, chalk, diorite, emery) and
# uploads the resulting bundle as a build artifact.

jobs:
  build:
    name: pebble build
    runs-on: ubuntu-latest
    container:
      image: rebble/pebble-sdk:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # The image already has the SDK core installed AND activated for its
      # in-image `pebble` user (under /home/pebble/.pebble-sdk). The job runs as
      # root (so checkout can write the workspace), and root has no SDK — and we
      # can't install one, because the image's ancient Python 2.7 cert bundle
      # fails TLS verification against modern GitHub (and the official download
      # server is dead anyway). So just point root's SDK home at the pre-installed
      # one via a symlink. Its virtualenv keeps its original absolute paths under
      # /home/pebble, so nothing needs relocating. NO_TRACKING already exists in
      # that dir, so the interactive analytics prompt stays suppressed.
      - name: Use the SDK core pre-installed in the image
        run: |
          test -d /home/pebble/.pebble-sdk
          ln -sfn /home/pebble/.pebble-sdk "$HOME/.pebble-sdk"
          pebble sdk list

      - name: pebble build
        run: pebble build

      - name: Upload .pbw
        uses: actions/upload-artifact@v4
        with:
          name: tesla-control-pbw
          path: build/*.pbw
          if-no-files-found: error
