name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Builds the watchapp .pbw with the Rebble fork of the Pebble SDK.
# This compiles for all targetPlatforms (basalt, chalk, diorite, emery) and
# uploads the resulting bundle as a build artifact.

jobs:
  build:
    name: pebble build
    runs-on: ubuntu-latest
    container:
      image: rebble/pebble-sdk:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # The image activates the SDK core for the in-image `pebble` user, but the
      # job runs as root (so checkout can write the workspace). Root therefore
      # has no SDK and pebble-tool would try to fetch "latest" from the dead
      # official download server (DNS failure). So install the SDK core for root
      # from the same community mirror the image uses. NO_TRACKING opts out of
      # the interactive analytics prompt (no stdin in CI -> EOFError otherwise).
      - name: Install Pebble SDK core for root
        env:
          # Matches PEBBLE_SDK_VERSION baked into rebble/pebble-sdk.
          SDK_VERSION: '4.3'
          SDK_URL: 'https://github.com/aveao/PebbleArchive/raw/master/SDKCores/sdk-core-4.3.tar.bz2'
        run: |
          mkdir -p "$HOME/.pebble-sdk"
          touch "$HOME/.pebble-sdk/NO_TRACKING"
          yes | pebble sdk install "$SDK_URL"
          pebble sdk activate "$SDK_VERSION"

      - name: pebble build
        run: pebble build

      - name: Upload .pbw
        uses: actions/upload-artifact@v4
        with:
          name: tesla-control-pbw
          path: build/*.pbw
          if-no-files-found: error
