name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Builds the watchapp .pbw with the Rebble fork of the Pebble SDK.
# This compiles for all targetPlatforms (basalt, chalk, diorite, emery) and
# uploads the resulting bundle as a build artifact.

jobs:
  build:
    name: pebble build
    runs-on: ubuntu-latest
    container:
      image: rebble/pebble-sdk:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # The image ships an SDK core already installed+activated for some non-root
      # user, but the job runs as root (so checkout can write the workspace) and
      # root has no SDK. We can't install one: the official download server is
      # dead, and the image's Python 2.7 cert bundle fails TLS against the GitHub
      # mirror. So auto-detect the pre-installed SDK home and symlink root's to
      # it (its virtualenv keeps its original absolute paths, so nothing moves).
      # Diagnostics are printed so the path can be pinned down if detection misses.
      - name: Use the SDK core pre-installed in the image
        shell: bash
        run: |
          set -x
          id; echo "HOME=$HOME"; cat /etc/passwd
          find / -maxdepth 6 -type d -name '.pebble-sdk' 2>/dev/null
          find / -maxdepth 8 -type d \( -name sdk-core -o -name SDKs \) 2>/dev/null | head
          sdk="$(find / -maxdepth 6 -type d -name '.pebble-sdk' 2>/dev/null | grep -v "^${HOME}/" | head -1)"
          echo "detected SDK home: [$sdk]"
          if [ -n "$sdk" ] && [ "$sdk" != "$HOME/.pebble-sdk" ]; then
            ln -sfn "$sdk" "$HOME/.pebble-sdk"
          fi
          touch "$HOME/.pebble-sdk/NO_TRACKING" 2>/dev/null || true
          pebble sdk list || true

      - name: pebble build
        run: pebble build

      - name: Upload .pbw
        uses: actions/upload-artifact@v4
        with:
          name: tesla-control-pbw
          path: build/*.pbw
          if-no-files-found: error
