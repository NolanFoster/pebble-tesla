name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Builds the watchapp .pbw with the Rebble fork of the Pebble SDK.
# This compiles for all targetPlatforms (basalt, chalk, diorite, emery) and
# uploads the resulting bundle as a build artifact.

jobs:
  build:
    name: pebble build
    runs-on: ubuntu-latest
    container:
      image: rebble/pebble-sdk:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # pebble-tool prompts interactively to opt in to analytics on first run.
      # CI has no stdin, so the prompt throws EOFError and the build fails.
      # Dropping a NO_TRACKING file in the SDK home opts out non-interactively.
      - name: Disable Pebble SDK analytics prompt
        run: |
          for d in "$HOME/.pebble-sdk" /github/home/.pebble-sdk /root/.pebble-sdk; do
            mkdir -p "$d" && touch "$d/NO_TRACKING"
          done

      - name: pebble build
        run: pebble build

      - name: Upload .pbw
        uses: actions/upload-artifact@v4
        with:
          name: tesla-control-pbw
          path: build/*.pbw
          if-no-files-found: error
