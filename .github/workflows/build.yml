name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Builds the watchapp .pbw with the Rebble fork of the Pebble SDK.
# This compiles for all targetPlatforms (basalt, chalk, diorite, emery) and
# uploads the resulting bundle as a build artifact.

jobs:
  build:
    name: pebble build
    runs-on: ubuntu-latest
    container:
      image: rebble/pebble-sdk:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: pebble build
        run: pebble build

      - name: Upload .pbw
        uses: actions/upload-artifact@v4
        with:
          name: tesla-control-pbw
          path: build/*.pbw
          if-no-files-found: error
