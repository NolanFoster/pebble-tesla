name: Build

on:
  push:
    branches: [staging, main]
  pull_request:
  workflow_dispatch:

# Only one build per ref at a time; a new push to the same branch/PR cancels the
# in-flight run. Combined with the push branch filter above, a PR branch builds
# once (via pull_request) instead of twice (push + pull_request).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Builds the watchapp .pbw with the Rebble fork of the Pebble SDK. One job per
# target platform (a matrix) so each shows up as its own check — a single
# platform's compile failure is obvious at a glance. pebble build normally
# compiles every platform in package.json, so each job first narrows
# targetPlatforms to its one platform.

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # don't cancel the other platforms when one fails
      matrix:
        platform: [basalt, chalk, diorite, emery]
    container:
      image: rebble/pebble-sdk:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # The image has the SDK core installed+activated under /root/.pebble-sdk,
      # but the job runs as root with GitHub's HOME=/github/home override, so the
      # tool looks in the wrong place and falls back to downloading — which fails
      # (dead official server; image's Python 2.7 cert bundle can't do GitHub TLS).
      # So locate the .pebble-sdk that actually contains an SDK core and point
      # $HOME/.pebble-sdk at it. The SDK virtualenv keeps its original absolute
      # paths, so nothing needs relocating.
      - name: Use the SDK core pre-installed in the image
        shell: bash
        run: |
          set -x
          core="$(find / -maxdepth 8 -type d -name sdk-core 2>/dev/null | head -1)"
          test -n "$core"                 # fail loudly if the image layout changed
          sdk="${core%%/SDKs/*}"          # /root/.pebble-sdk/SDKs/4.3/sdk-core -> /root/.pebble-sdk
          echo "SDK home: $sdk"
          if [ "$sdk" != "$HOME/.pebble-sdk" ]; then
            ln -sfn "$sdk" "$HOME/.pebble-sdk"
          fi
          touch "$HOME/.pebble-sdk/NO_TRACKING" 2>/dev/null || true
          pebble sdk list

      # pebble build compiles every platform in package.json; rewrite it to this
      # job's single platform so a failure is attributable to that platform alone.
      - name: Limit build to ${{ matrix.platform }}
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));p.pebble.targetPlatforms=[process.argv[1]];fs.writeFileSync("package.json",JSON.stringify(p,null,2));' "${{ matrix.platform }}"

      - name: pebble build
        run: pebble build

      - name: Upload ${{ matrix.platform }} .pbw
        uses: actions/upload-artifact@v4
        with:
          name: tesla-control-${{ matrix.platform }}
          path: build/*.pbw
          if-no-files-found: error
